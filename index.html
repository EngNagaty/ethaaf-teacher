<script>
(function(){

  var mobile=function(){ return window.innerWidth<=760; };

    app.innerHTML='';
    mount('Main',{start:s,fullh:844},app);
    document.querySelectorAll('.j').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-s')===s); });
